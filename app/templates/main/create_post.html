{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-header bg-success text-white">
                <h3 class="mb-0">Rédiger un nouvel article</h3>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="">
                    <div class="mb-3">
                        <label for="title" class="form-label">Titre de l'article</label>
                        <input type="text" class="form-control" id="title" name="title" required placeholder="Ex: Débuter avec PostgreSQL">
                    </div>
                    <div class="mb-3">
                        <label for="content" class="form-label">Contenu</label>
                        <textarea class="form-control" id="content" name="content" rows="8" required placeholder="Écrivez votre texte ici..."></textarea>
                    </div>
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <a href="{{ url_for('main.index') }}" class="btn btn-secondary me-md-2">Annuler</a>
                        <button type="submit" class="btn btn-success px-4">Publier</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
